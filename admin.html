<!DOCTYPE html>
<html lang="de">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Panel | UltraGames</title>

  <link rel="stylesheet" href="css/style.css">

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

</head>

<body>

<div class="admin-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="logo sidebar-logo">
      ULTRAGAMES
    </div>

    <nav class="sidebar-nav">

      <a href="#">Dashboard</a>
      <a href="#">Spieler</a>
      <a href="#">Bans</a>
      <a href="#">News</a>
      <a href="#">Server</a>
      <a href="#">Einstellungen</a>

    </nav>

  </aside>

  <!-- CONTENT -->
  <main class="admin-content">

    <header class="admin-header">

      <h1>
        ADMIN PANEL
      </h1>

      <button class="btn primary">
        Logout
      </button>

    </header>

    <!-- STATS -->
    <section class="stats-grid">

      <div class="admin-card">

        <h2>Spieler Online</h2>

        <p class="admin-number">
          127
        </p>

      </div>

      <div class="admin-card">

        <h2>Gebannte Spieler</h2>

        <p class="admin-number">
          24
        </p>

      </div>

      <div class="admin-card">

        <h2>Discord Mitglieder</h2>

        <p class="admin-number">
          1,483
        </p>

      </div>

    </section>

    <!-- TABLE -->
    <section class="admin-table-section">

      <h2 class="table-title">
        Letzte Spieler
      </h2>

      <table class="admin-table">

        <thead>

          <tr>

            <th>Spieler</th>
            <th>Rang</th>
            <th>Status</th>

          </tr>

        </thead>

        <tbody>

          <tr>

            <td>UltraOwner</td>
            <td>Owner</td>
            <td>
              <span class="online">
                Online
              </span>
            </td>

          </tr>

          <tr>

            <td>BlueDev</td>
            <td>Developer</td>
            <td>
              <span class="offline">
                Offline
              </span>
            </td>

          </tr>

          <tr>

            <td>NovaMod</td>
            <td>Moderator</td>
            <td>
              <span class="online">
                Online
              </span>
            </td>

          </tr>

        </tbody>

      </table>

    </section>

  </main>

</div>

</body>
</html>
