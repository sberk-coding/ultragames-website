<!DOCTYPE html>
<html lang="de">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>UltraGames Login</title>

  <link rel="stylesheet" href="./css/style.css">

  <link
  href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap"
  rel="stylesheet">

</head>

<body>

<div class="login-page">

  <div class="login-card">

    <div class="logo">
      ULTRAGAMES
    </div>

    <h1>
      ADMIN LOGIN
    </h1>

    <p class="login-subtitle">
      Melde dich als Admin an.
    </p>

    <form id="loginForm">

      <div class="input-box">

        <label>E-Mail</label>

        <input
        type="email"
        id="email"
        placeholder="admin@ultragames.net"
        required>

      </div>

      <div class="input-box">

        <label>Passwort</label>

        <input
        type="password"
        id="password"
        placeholder="••••••••"
        required>

      </div>

      <button
      type="submit"
      class="login-button">

        EINLOGGEN

      </button>

    </form>

    <p id="loginMessage"></p>

  </div>

</div>

<script type="module" src="./js/auth.js"></script>

</body>
</html>
